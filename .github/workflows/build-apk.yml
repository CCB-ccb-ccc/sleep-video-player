name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # AGP 9.0.1 + permission_handler_android 14 需要 compileSdk/targetSdk 37；
      # 裸写 platforms;android-37 因存在多个修订版会装不上，故指定稳定版 37.1。
      # 注意：ubuntu-24.04 runner 未将 sdkmanager 加入 PATH，需按全路径定位。
      - name: Install Android SDK platform 37
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          SM=$(ls "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SM" "platforms;android-37.1"

      - name: Flutter pub get
        run: flutter pub get

      # video_thumbnail 最新版(0.5.6)的 android/build.gradle 仍使用 Gradle 7+ 已移除的
      # jcenter()，会导致 evaluation 失败。将其替换为 mavenCentral()（包本身与 API 不变）。
      - name: Patch video_thumbnail (jcenter removed in Gradle 7+)
        run: |
          F=$(ls "$HOME"/.pub-cache/hosted/pub.dev/video_thumbnail-*/android/build.gradle 2>/dev/null | head -1)
          if [ -n "$F" ]; then sed -i 's/jcenter()/mavenCentral()/g' "$F"; echo "patched $F"; else echo "video_thumbnail build.gradle not found, skip"; fi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
