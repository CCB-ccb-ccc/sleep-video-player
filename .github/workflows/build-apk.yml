name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # AGP 9.0.1 + permission_handler_android 14 需要 compileSdk/targetSdk 37；
      # 裸写 platforms;android-37 因存在多个修订版会装不上，故指定稳定版 37.1。
      # 注意：ubuntu-24.04 runner 未将 sdkmanager 加入 PATH，需按全路径定位。
      - name: Install Android SDK platform 37
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          SM=$(ls "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SM" "platforms;android-37.1"

      - name: Flutter pub get
        run: flutter pub get

      # video_thumbnail 最新版(0.5.6)的 android/build.gradle：
      # 1) 仍使用 Gradle 7+ 已移除的 jcenter() → 替换为 mavenCentral()；
      # 2) compileSdkVersion 硬编码为 33，而其依赖(androidx.fragment/window 等)要求 ≥34
      #    → 改为 37（与 App 一致）。包本身与 API 不变，仅修正过时的构建配置。
      - name: Patch video_thumbnail (jcenter removed; compileSdk 33 too low)
        run: |
          F=$(ls "$HOME"/.pub-cache/hosted/pub.dev/video_thumbnail-*/android/build.gradle 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            sed -i -E 's/jcenter\(\)/mavenCentral()/g; s/compileSdkVersion[[:space:]]*33/compileSdkVersion 37/g' "$F"
            echo "patched $F"
            grep -nE "jcenter|compileSdkVersion" "$F" || true
          else
            echo "video_thumbnail build.gradle not found, skip"
          fi

      # 从 GitHub Secret 解码稳定的自签名密钥（PKCS12），生成 android/key.properties 供 Gradle 签名
      - name: Prepare signing keystore (from GitHub Secret)
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > "$HOME/release.p12"
          {
            echo "storeFile=$HOME/release.p12"
            echo "storePassword=android"
            echo "keyAlias=androidkey"
            echo "keyPassword=android"
          } > android/key.properties
          echo "key.properties written"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Read version from pubspec
        id: ver
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          TAG="v${RAW%%+*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          APK=build/app/outputs/flutter-apk/app-release.apk
          # 若 release 已存在（如旧 run 仅建了 tag）则改为追加上传，避免重复创建失败
          gh release create "$TAG" --title "Sleep Video Player $TAG" --notes "自动发布" "$APK" 2>/dev/null || \
          gh release upload "$TAG" "$APK" --clobber
